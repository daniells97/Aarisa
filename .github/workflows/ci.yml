name: CI
# Pull requests: typecheck, unit tests against a throwaway Postgres, build, and Playwright.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aarisa
          POSTGRES_PASSWORD: aarisa
          POSTGRES_DB: aarisa_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aarisa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://aarisa:aarisa@127.0.0.1:5432/aarisa_ci
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      N8N_SERVICE_TOKEN: ci-only-service-token-0123456789abcdef
      DEV_LOGIN: '1'
      APP_BASE_URL: http://127.0.0.1:3100
      TZ: America/Los_Angeles
      FILE_STORAGE_DIR: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
