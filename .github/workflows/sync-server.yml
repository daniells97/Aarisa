name: Sync server
# Brings the server checkout up to date when main changes on GitHub
# (for example after merging a PR). Never discards work on the server:
# if there are local changes or another branch is checked out, it only fetches.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/projects/aarisa-paqueteria/Aarisa
            git fetch origin
            branch=$(git rev-parse --abbrev-ref HEAD)
            if [ -n "$(git status --porcelain)" ]; then
              echo "Uncommitted changes on the server ($branch). Fetched only."
            elif [ "$branch" = "main" ]; then
              git merge --ff-only origin/main
            else
              echo "Server is on branch $branch. Fetched only."
            fi
            git log -1 --oneline
