<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aarisa mobile · Today's drivers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0D5C46}a:hover{color:#08402F}
:focus-visible{outline:3px solid #1F5FA8;outline-offset:2px}
.cond{font-family:'Barlow Condensed','Barlow',sans-serif}
.num{font-variant-numeric:tabular-nums lining-nums}
.plate{display:inline-flex;align-items:center;justify-content:center;height:30px;min-width:64px;padding:0 8px;box-sizing:border-box;border-radius:6px;background:#0D5C46;color:#FFFFFF;font:700 17px/1 'Barlow Condensed',sans-serif;letter-spacing:.03em;box-shadow:inset 0 0 0 2px #0D5C46,inset 0 0 0 3px rgba(255,255,255,.75);white-space:nowrap}
.plate.amb{background:#F2A900;color:#1C2226;box-shadow:inset 0 0 0 2px #F2A900,inset 0 0 0 3px rgba(28,34,38,.75)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:500;white-space:nowrap}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:#E3F0EA;color:#0D5C46}.wait{background:#E6EEF8;color:#1F5FA8}.pv{background:#EEEAF6;color:#4B3F72}
.route{width:100%;min-height:62px;background:#FFFFFF;border:0;border-bottom:1px solid #EEF0EE;padding:10px 16px;display:flex;align-items:center;gap:14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.tabbar a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:12px;font-weight:500;color:#5F696E;text-decoration:none}
.tabbar a.on{color:#0D5C46;font-weight:600}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4F2; font-family: 'Barlow', sans-serif; color: #1C2226; overflow: hidden; position: relative">
<header style="padding: 22px 16px 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; color: #4A5459; font-weight: 500">T-Force</span>
<div style="display: flex; gap: 4px">
<button type="button" aria-label="Previous day" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DADFDB; background: #FFFFFF; color: #1C2226; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Next day" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DADFDB; background: #FFFFFF; color: #1C2226; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
<h1 class="cond" style="margin: 0; font-size: 36px; font-weight: 600; line-height: 1">Thursday, June 18</h1>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="pill ok">9 set</span><span class="pill wait">2 waiting</span><span class="pill" style="background: #FFF4D6; color: #6B4600">1 no driver</span></div>
</header>

<div style="flex: 1 1 auto; overflow-y: auto; padding: 0 0 150px">
<section aria-label="Needs you" style="margin: 0 16px 16px; background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 2px #F2A900">
<div style="display: flex; align-items: center; gap: 12px"><span class="plate amb">9000Z</span><span style="font-weight: 600; font-size: 16px">Who drove it?</span></div>
<p style="margin: 0; font-size: 15px; color: #3A4449; line-height: 1.45">You wrote “the new guy from Puma”. He isn't on the driver list yet.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Mobile-Exceptions.dc.html" style="min-height: 48px; border-radius: 12px; background: #0D5C46; color: #FFFFFF; font-size: 15.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Add to Puma</a>
<a href="Mobile-Exceptions.dc.html" style="min-height: 48px; border-radius: 12px; border: 1px solid #CDD3CF; color: #1C2226; font-size: 15.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Pick a driver</a>
</div>
</section>

<section aria-label="All routes" style="background: #FFFFFF; border-top: 1px solid #DADFDB">
<sc-for list="{{routes}}" as="r" hint-placeholder-count="12">
<button type="button" class="route">
<span class="plate">{{r.code}}</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{r.today}}</span>
<span style="font-size: 13.5px; color: #5F696E">{{r.note}}</span>
</span>
<sc-if value="{{r.showPill}}" hint-placeholder-val="{{false}}"><span class="{{r.cls}}">{{r.status}}</span></sc-if>
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; flex: none; fill: none; stroke: #8E9893; stroke-width: 2; stroke-linecap: round"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</section>
</div>

<a href="Mobile-ExtraJob.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 80px; min-height: 54px; border-radius: 16px; background: #0D5C46; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 8px 20px rgba(13, 92, 70, 0.32)">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>Log extra job</a>

<nav class="tabbar" aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; border-top: 1px solid #DADFDB; display: flex; padding: 0 8px">
<a href="Mobile-Today.dc.html" class="on" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Today</a>
<a href="Mobile-ExtraJob.dc.html"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>Extra jobs</a>
<a href="Mobile-Exceptions.dc.html"><svg viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"></path><path d="M12 8.5v4M12 15.5v.3"></path></svg>Exceptions</a>
<a href="Mobile-Overview.dc.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Week</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

    var rows = [
      ['9000A','Robert Arteaga','Usual driver','',''],
      ['9000B','Leonardo Vicentini','Usual driver','',''],
      ['9000E','Norwin Saloman','Changed from Nayibi Perez','Changed','ok'],
      ['9000F','Jaime Andres','Usual driver','',''],

</script>
</body>
</html>
